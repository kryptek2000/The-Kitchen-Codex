name: Build The Kitchen Codex

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Install, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Bun lockfile consistency
        run: |
          if ! bun install --frozen-lockfile; then
            echo "::error title=Bun Lockfile Mismatch::bun.lock does not match package.json. The lockfile may have been manually edited or become stale. To fix: run 'bun install' locally and commit the resulting bun.lock."
            exit 1
          fi

      - name: Typecheck (tsc --noEmit)
        run: bun run lint

      - name: Run test suite
        run: bun run test

      - name: Build application
        run: bun run build

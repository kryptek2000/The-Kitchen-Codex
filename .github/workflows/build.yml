name: Build The Kitchen Codex

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-core:
    name: Fast Core
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        run: bun install --frozen-lockfile

      - name: Verify complete test-plan coverage
        run: node scripts/ci/test-plan.mjs --check

      - name: Typecheck (tsc --noEmit)
        run: bun run lint

      - name: Select fast test group
        run: node scripts/ci/test-plan.mjs --group fast --list-file "$RUNNER_TEMP/fast-tests.txt"

      - name: Run fast tests
        run: |
          bun x vitest run --maxWorkers=4 --testTimeout=60000 \
            $(cat "$RUNNER_TEMP/fast-tests.txt")

  heavy-nutrition:
    name: Heavy Nutrition & SHISO (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        run: bun install --frozen-lockfile

      - name: Select heavy shard
        run: |
          node scripts/ci/test-plan.mjs \
            --group heavy \
            --shard "${{ matrix.shard }}/4" \
            --list-file "$RUNNER_TEMP/heavy-tests.txt"

      - name: Run heavy shard
        run: |
          bun x vitest run --maxWorkers=2 --testTimeout=60000 \
            $(cat "$RUNNER_TEMP/heavy-tests.txt")

  security:
    name: Security (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        run: bun install --frozen-lockfile

      - name: Select security shard
        run: |
          node scripts/ci/test-plan.mjs \
            --group security \
            --shard "${{ matrix.shard }}/2" \
            --list-file "$RUNNER_TEMP/security-tests.txt"

      - name: Run security shard
        run: |
          bun x vitest run --maxWorkers=2 --testTimeout=60000 \
            $(cat "$RUNNER_TEMP/security-tests.txt")

  quality:
    name: Build, Browser Proof & Plugin Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      # Phase 8B: durable production-browser proof for Advanced Nutrition.
      # It consumes the exact build produced above and fails the job on failure.
      # No secrets are required and no AI provider is used.
      - name: Resolve a real Chrome for the browser proof
        run: |
          set -euo pipefail
          if command -v google-chrome > /dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium > /dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif [ -x /opt/google/chrome/chrome ]; then
            echo "CHROME_BIN=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
          else
            echo "::error title=No Chrome Browser::No Chrome/Chromium binary is available on this runner, so the Advanced Nutrition production-browser proof cannot run. Install Google Chrome or set CHROME_BIN."
            exit 1
          fi
          echo "using CHROME_BIN=$CHROME_BIN"
          "$CHROME_BIN" --version

      - name: Advanced Nutrition production-browser proof
        run: bun run test:nutrition:browser

      # Phase 8B: durable plugin-isolation proof, after the build so the emitted
      # artifact exists. The full test jobs are separate checkouts, so they never
      # see plugin/main.js.
      - name: Build Obsidian plugin
        run: bun run build:plugin

      - name: Verify plugin isolation
        run: bun run test:plugin:isolation

name: Linux Desktop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop:
    name: Native Vault, Desktop Tests, Package & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node for N-API headers
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install and Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: ${{ runner.os }}-desktop-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-libc-dev xvfb xauth \
            libnss3 libgbm1
          # Ubuntu's t64 transition changes some library package names.
          for package in \
            libgtk-3-0 libgtk-3-0t64 \
            libatk-bridge2.0-0 libatk-bridge2.0-0t64 \
            libasound2 libasound2t64; do
            if apt-cache show "$package" >/dev/null 2>&1; then
              sudo apt-get install -y "$package"
            fi
          done
          test -f /usr/include/linux/openat2.h
          g++ --version

      - name: Resolve N-API headers and CI paths
        run: |
          NODE_HEADERS="$(node -p 'require("node:path").join(require("node:path").dirname(process.execPath), "..", "include", "node")')"
          test -f "$NODE_HEADERS/node_api.h"
          echo "TKC_NODE_HEADERS=$NODE_HEADERS" >> "$GITHUB_ENV"
          echo "TKC_DESKTOP_OUT=$RUNNER_TEMP/tkc-desktop-package" >> "$GITHUB_ENV"
          echo "TKC_DESKTOP_SMOKE_ROOT=$RUNNER_TEMP/tkc-desktop-smoke" >> "$GITHUB_ENV"
          echo "N-API headers: $NODE_HEADERS"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            node node_modules/electron/install.js
          fi
          test -x node_modules/electron/dist/electron
          node_modules/electron/dist/electron --version

      - name: Build native Vault filesystem helper from committed source
        run: |
          node scripts/build-desktop-native.mjs
          test -f desktop/native/tkc_vault.node
          node -e '
            const helper = require("./desktop/native/tkc_vault.node");
            const required = ["readText","readBinary","writeText","writeBinary","writeTextIfUnchanged","list","stat","exists","mkdir","remove"];
            for (const name of required) {
              if (typeof helper[name] !== "function") throw new Error(`missing native export: ${name}`);
            }
            console.log("native helper exports verified:", required.length);
          '

      - name: Syntax check desktop shell and native build scripts
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/fsSafety.cjs
          node --check desktop/security.cjs
          node --check desktop/vaultState.cjs
          node --check desktop/vaultFs.cjs
          node --check scripts/build-desktop-native.mjs
          node --check scripts/build-desktop-package.mjs
          node --check scripts/verify-desktop-package.mjs
          bash -n scripts/ci/desktop-package-smoke.sh

      - name: Select desktop, Vault, and asset test group
        run: |
          node scripts/ci/test-plan.mjs \
            --group desktop \
            --list-file "$RUNNER_TEMP/desktop-tests.txt"

      - name: Run desktop, Vault, and asset regression tests
        run: |
          bun x vitest run --maxWorkers=4 --testTimeout=60000 \
            $(cat "$RUNNER_TEMP/desktop-tests.txt")

      - name: Build production application
        run: bun run build

      - name: Build Linux desktop package
        run: |
          rm -rf "$TKC_DESKTOP_OUT"
          npm run desktop:package

      - name: Verify packaged native helper, source parity, and self-test
        run: |
          node scripts/verify-desktop-package.mjs \
            "$TKC_DESKTOP_OUT/TheKitchenCodex-linux-x64" \
            "$RUNNER_TEMP/tkc-desktop-package-manifest.txt"
          du -sh "$TKC_DESKTOP_OUT/TheKitchenCodex-linux-x64"

      - name: Sandbox-enabled packaged startup smoke
        run: |
          bash scripts/ci/desktop-package-smoke.sh \
            "$TKC_DESKTOP_OUT/TheKitchenCodex-linux-x64" \
            "$TKC_DESKTOP_SMOKE_ROOT"

      - name: Upload small desktop package manifest
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-package-manifest
          path: |
            ${{ runner.temp }}/tkc-desktop-package-manifest.txt
            ${{ runner.temp }}/tkc-desktop-smoke/smoke-result.txt
          if-no-files-found: error
          retention-days: 7

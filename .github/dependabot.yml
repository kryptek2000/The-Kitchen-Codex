# Keep The Kitchen Codex dependencies and GitHub Actions up to date.
#
# - "bun" tracks the JavaScript/TypeScript dependencies declared in package.json
#   and resolved by bun.lock (the repository's package manager).
# - "github-actions" tracks the third-party Actions referenced in workflows.
#
# Kept deliberately simple: weekly checks, no aggressive update policies.
version: 2
updates:
  # DISABLED: Dependabot's Bun updater does not yet support this repository's
  # bun.lock (`lockfileVersion: 2`). It fails with:
  #   "Unsupported bun.lock 'lockfileVersion' 2 ... supports up to 1".
  # Bun remains the repository's package manager; re-enable this entry once
  # Dependabot ships lockfileVersion 2 support.
  # - package-ecosystem: "bun"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
